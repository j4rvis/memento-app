openapi: 3.1.0
info:
  title: Memento API
  description: |
    REST API for the Memento personal productivity app.

    ## Authentication
    1. Create an API client in **Settings → API Access**
    2. Exchange credentials for a Bearer JWT via `POST /api/auth/token`
    3. Include `Authorization: Bearer <token>` on all `/api/v1/` requests

    Tokens expire after 24 hours. Re-authenticate to get a new token.

    ## Scopes
    Each API client is granted a set of scopes. The wildcard scope `*` grants full access.
    | Scope | Description |
    |---|---|
    | `todos:read` | Read todos |
    | `todos:write` | Create, update, delete todos |
    | `bookmarks:read` | Read bookmarks |
    | `bookmarks:write` | Create, delete bookmarks |
    | `feeds:read` | Read feeds and articles |
    | `feeds:write` | Add, delete feeds and articles; update article state |
    | `google:read` | Read Google accounts and calendars |
    | `newspaper:write` | Generate newspaper PDFs |
    | `*` | Full access |
  version: 1.0.0

servers:
  - url: https://your-app.vercel.app
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]

    Todo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        is_completed:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 3
        due_date:
          type: string
          format: date
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Bookmark:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        excerpt:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        site_name:
          type: string
          nullable: true
        content_type:
          type: string
        is_read:
          type: boolean
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time

    Feed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          format: uri
        site_url:
          type: string
          format: uri
          nullable: true
        description:
          type: string
          nullable: true
        unread_count:
          type: integer
        last_fetched_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    FeedArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        is_read:
          type: boolean
        is_starred:
          type: boolean
        created_at:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  /api/auth/token:
    post:
      summary: Obtain a Bearer JWT
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id:
                  type: string
                  example: mc_abc123def456
                client_secret:
                  type: string
                  example: 64-char-hex-secret
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 86400
        '400':
          description: Missing fields
        '401':
          description: Invalid credentials

  /api/v1/todos:
    get:
      summary: List todos
      tags: [Todos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todos list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '401':
          $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/schemas/Error'
    post:
      summary: Create a todo
      tags: [Todos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: integer
                  minimum: 0
                  maximum: 3
                due_date:
                  type: string
                  format: date
                project_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/schemas/Error'

  /api/v1/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a todo
      tags: [Todos]
      responses:
        '200':
          description: Todo record
        '404':
          $ref: '#/components/schemas/Error'
    put:
      summary: Update a todo
      tags: [Todos]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                is_completed:
                  type: boolean
                priority:
                  type: integer
                due_date:
                  type: string
                project_id:
                  type: string
      responses:
        '200':
          description: Updated todo
        '404':
          $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a todo
      tags: [Todos]
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/schemas/Error'

  /api/v1/bookmarks:
    get:
      summary: List bookmarks
      tags: [Bookmarks]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: is_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Bookmarks list
    post:
      summary: Create a bookmark
      tags: [Bookmarks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                title:
                  type: string
                content:
                  type: string
                excerpt:
                  type: string
      responses:
        '201':
          description: Created
        '409':
          description: Duplicate URL

  /api/v1/bookmarks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a bookmark
      tags: [Bookmarks]
      responses:
        '200':
          description: Bookmark
        '404':
          $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a bookmark
      tags: [Bookmarks]
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/schemas/Error'

  /api/v1/feeds:
    get:
      summary: List feeds
      tags: [Feeds]
      responses:
        '200':
          description: Feeds with unread_count
    post:
      summary: Add a feed by URL
      tags: [Feeds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '201':
          description: Feed created
        '409':
          description: Duplicate URL

  /api/v1/feeds/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a feed
      tags: [Feeds]
      responses:
        '200':
          description: Feed record
        '404':
          $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a feed
      tags: [Feeds]
      responses:
        '204':
          description: Deleted

  /api/v1/feeds/{id}/articles:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List articles for a feed
      tags: [Feeds]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: is_read
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Articles list
        '404':
          description: Feed not found

  /api/v1/feeds/{id}/articles/{article_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: article_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a feed article
      tags: [Feeds]
      responses:
        '200':
          description: Article
        '404':
          $ref: '#/components/schemas/Error'
    patch:
      summary: Update article read/starred state
      tags: [Feeds]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_read:
                  type: boolean
                is_starred:
                  type: boolean
      responses:
        '200':
          description: Updated article
        '422':
          description: Empty body
    delete:
      summary: Delete an article
      tags: [Feeds]
      responses:
        '204':
          description: Deleted

  /api/v1/google/accounts:
    get:
      summary: List connected Google accounts
      tags: [Google]
      responses:
        '200':
          description: Accounts list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        created_at:
                          type: string

  /api/v1/google/calendars:
    get:
      summary: List calendars grouped by Google account
      tags: [Google]
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
          description: Filter to a specific Google account
      responses:
        '200':
          description: Calendars grouped by account

  /api/v1/newspaper/generate:
    post:
      summary: Generate a newspaper PDF
      tags: [Newspaper]
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json]
          description: Return JSON metadata instead of the PDF binary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template_id:
                  type: string
                  format: uuid
                  description: UUID of a saved newspaper template
                config:
                  type: object
                  description: Inline NewspaperConfig object
      responses:
        '200':
          description: PDF binary (or JSON metadata if format=json)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      generated_at:
                        type: string
                      size_bytes:
                        type: integer
        '404':
          description: Template not found
        '422':
          description: Missing template_id and config
