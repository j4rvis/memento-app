<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>Memento Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Setup: enter app URL -->
  <div id="view-setup" class="view" hidden>
    <div class="header">
      <div class="logo">M</div>
      <h1>Memento Clipper</h1>
    </div>
    <p class="subtitle">Enter your Memento app URL to get started.</p>
    <form id="form-setup">
      <label for="input-app-url">Memento URL</label>
      <input id="input-app-url" type="url" placeholder="https://your-memento.vercel.app" required>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>

  <!-- Login -->
  <div id="view-login" class="view" hidden>
    <div class="header">
      <div class="logo">M</div>
      <h1>Log In</h1>
    </div>
    <form id="form-login">
      <label for="input-email">Email</label>
      <input id="input-email" type="email" placeholder="you@example.com" required>
      <label for="input-password">Password</label>
      <input id="input-password" type="password" placeholder="Password" required>
      <div id="login-error" class="error" hidden></div>
      <button type="submit" class="btn btn-primary" id="btn-login">Log In</button>
    </form>
    <button class="btn btn-link" id="btn-change-url">Change URL</button>
  </div>

  <!-- Instance picker -->
  <div id="view-instances" class="view" hidden>
    <div class="header">
      <div class="logo">M</div>
      <h1>Select Workspace</h1>
    </div>
    <p class="subtitle">Choose where to save articles.</p>
    <div id="instances-list" class="instances-list"></div>
    <button class="btn btn-link" id="btn-logout-inst">Log Out</button>
  </div>

  <!-- Clipping -->
  <div id="view-clipping" class="view" hidden>
    <div class="header">
      <div class="logo">M</div>
      <h1>Saving...</h1>
    </div>
    <div class="spinner"></div>
    <p id="clipping-title" class="page-title"></p>
  </div>

  <!-- Success -->
  <div id="view-success" class="view" hidden>
    <div class="header">
      <div class="icon-check">&#10003;</div>
      <h1>Saved!</h1>
    </div>
    <p id="success-title" class="page-title"></p>
    <p id="success-instance" class="instance-badge"></p>
    <a id="success-link" class="btn btn-primary" target="_blank">Open in Memento</a>
    <div class="footer-links">
      <button class="btn btn-link" id="btn-change-instance">Change Workspace</button>
      <button class="btn btn-link" id="btn-logout">Log Out</button>
    </div>
  </div>

  <!-- Duplicate -->
  <div id="view-duplicate" class="view" hidden>
    <div class="header">
      <div class="icon-info">i</div>
      <h1>Already Saved</h1>
    </div>
    <p id="duplicate-title" class="page-title"></p>
    <p id="duplicate-instance" class="instance-badge"></p>
    <a id="duplicate-link" class="btn btn-primary" target="_blank">Open in Memento</a>
    <div class="footer-links">
      <button class="btn btn-link" id="btn-change-instance-dup">Change Workspace</button>
      <button class="btn btn-link" id="btn-logout-dup">Log Out</button>
    </div>
  </div>

  <!-- Error -->
  <div id="view-error" class="view" hidden>
    <div class="header">
      <div class="icon-error">!</div>
      <h1>Error</h1>
    </div>
    <p id="error-message" class="error-text"></p>
    <button class="btn btn-primary" id="btn-retry">Try Again</button>
    <div class="footer-links">
      <button class="btn btn-link" id="btn-change-instance-err">Change Workspace</button>
      <button class="btn btn-link" id="btn-logout-err">Log Out</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
